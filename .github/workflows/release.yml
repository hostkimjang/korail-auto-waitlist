name: Signed release publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable app version, without v (must match the top changelog entry)
        required: true
        type: string
      compatible_from:
        description: Comma-separated approved source release versions (empty disables updates)
        required: false
        default: ""
        type: string
      dry_run:
        description: Rehearse every step from any branch with a throwaway signing key and publish nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-release-publication
  cancel-in-progress: false

# Verification, CLI tests and image builds start together. Only the bundle job signs, and it waits for
# every verification job and both image architectures, so an unverified commit is never signed or
# published. Images pushed before a failed verification stay unreferenced under the commit tag.
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release source and version
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Stable semantic version required')
          first = re.search(r'^## ([0-9]+\.[0-9]+\.[0-9]+)', pathlib.Path('CHANGELOG.md').read_text(), re.M)
          if not first or first.group(1) != version:
              raise SystemExit('Release version must match the first changelog entry')
          PY
          # A rehearsal may run from a review branch: it never receives the release key or publishes.
          if [ "$DRY_RUN" != true ]; then test "$GITHUB_REF" = refs/heads/main; fi
          test -z "$(git status --porcelain)"
      - run: python -m pip install -r scripts/releases/requirements.txt
      - run: python -m unittest discover -s scripts/releases -v
      - name: Confirm approved source releases can update to this source
        env:
          COMPATIBLE_FROM: ${{ inputs.compatible_from }}
        run: |
          # Installations update only between releases with the same database revision, settings
          # schema and storage images. compose.yml pins the storage images, so a wrong list fails
          # here before any image is built; the bundle job repeats this with the resolved images.
          source_args=()
          IFS=',' read -ra sources <<< "$COMPATIBLE_FROM"
          for source in "${sources[@]}"; do
            if [ -n "$source" ]; then source_args+=(--compatible-from "$source"); fi
          done
          python scripts/releases/check_update_sources.py --repository "$GITHUB_REPOSITORY" "${source_args[@]}"

  verify-api:
    # Same runner as repository-verify: Playwright 1.55 cannot install Chromium dependencies on
    # the Ubuntu 26.04 image that ubuntu-latest now selects.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: release-ci-only-postgres-not-a-secret
      SECRET_ENCRYPTION_KEY: release-ci-only-encryption-key-not-a-secret
      AUTH_SESSION_SECRET: release-ci-only-session-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra test --extra browser
        working-directory: apps/api
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: restore
      - run: uv run --frozen --extra browser playwright install --with-deps chromium
        working-directory: apps/api
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: save
      - name: Select Chrome for fixture tests
        run: |
          python - <<'PY'
          import os, shutil, subprocess, tempfile
          binary = shutil.which('google-chrome')
          if not binary:
              raise SystemExit('Google Chrome unavailable')
          version = subprocess.run([binary, '--version'], check=True, capture_output=True, text=True, timeout=30).stdout.strip()
          if not version.startswith('Google Chrome '):
              raise SystemExit('Unexpected runtime browser family')
          # Start Chrome once before the parallel test run. The first start on a fresh runner can
          # outlast Pydoll's start timeout while the other test workers keep the CPU busy.
          with tempfile.TemporaryDirectory() as profile:
              subprocess.run([binary, '--headless=new', '--no-sandbox', '--disable-gpu', '--no-first-run',
                              '--user-data-dir=' + profile, '--dump-dom', 'about:blank'],
                             check=True, capture_output=True, timeout=120)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('KORAIL_BROWSER_CHROMIUM_EXECUTABLE_PATH=' + binary + '\n')
          print('Pydoll runtime browser: ' + version)
          PY
      - run: make verify-api
        env:
          KORAIL_BROWSER_TEST_DISABLE_SANDBOX: "true"

  verify-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: release-ci-only-postgres-not-a-secret
      SECRET_ENCRYPTION_KEY: release-ci-only-encryption-key-not-a-secret
      AUTH_SESSION_SECRET: release-ci-only-session-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: restore
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: save
      - run: make verify-web-core

  verify-stack:
    # Compose configuration, operations scripts, the browser test image and the isolated full-stack E2E.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: release-ci-only-postgres-not-a-secret
      SECRET_ENCRYPTION_KEY: release-ci-only-encryption-key-not-a-secret
      AUTH_SESSION_SECRET: release-ci-only-session-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: restore
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: save
      - run: make config verify-ops verify-browser
      - run: npm run test:e2e:fullstack
        working-directory: apps/web

  native-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=5m ./...

  images:
    name: images (${{ matrix.name }}, ${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name: [api, web, browser, backup]
        arch: [amd64, arm64]
        include:
          - name: api
            context: apps/api
            dockerfile: apps/api/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
          - name: browser
            context: apps/api
            dockerfile: apps/api/Dockerfile.browser
          - name: backup
            context: .
            dockerfile: infra/backup/Dockerfile
          # Each architecture builds on its own CPU. Under QEMU the arm64 browser image's apt step took
          # 365 seconds against 42 seconds for the same step on amd64 (v1.4.4 release).
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select image repository
        id: naming
        env:
          IMAGE_KIND: ${{ matrix.name }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repository}/${IMAGE_KIND}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          # Push by digest only. images-merge puts the commit tag on the two-platform index.
          outputs: type=image,name=${{ steps.naming.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record platform digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid image digest" >&2; exit 1; }
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${ARCH}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.name }}-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  images-merge:
    name: images-merge (${{ matrix.name }})
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            original: rail-waitlist-api:local
          - name: web
            original: rail-waitlist-web:local
          - name: browser
            original: rail-waitlist-korail-browser-adapter:local
          - name: backup
            original: rail-waitlist-backup:local
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.name }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the two-platform index with the immutable commit tag
        id: merge
        env:
          IMAGE_KIND: ${{ matrix.name }}
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}/${IMAGE_KIND}"
          tag="${image}:${GITHUB_SHA}"
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "digests/${arch}")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid ${arch} digest" >&2; exit 1; }
            sources+=("${image}@${digest}")
          done
          docker buildx imagetools create --tag "$tag" "${sources[@]}"
          index="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          [[ "$index" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "invalid index digest" >&2; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "digest=${index}" >> "$GITHUB_OUTPUT"
      - name: Record immutable image result
        env:
          ORIGINAL: ${{ matrix.original }}
          TAG: ${{ steps.merge.outputs.tag }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |
          mkdir -p image-records
          python3 - <<'PY'
          import json, os, pathlib
          pathlib.Path('image-records/result.json').write_text(json.dumps({
              'original': os.environ['ORIGINAL'],
              'pinned': os.environ['TAG'] + '@' + os.environ['DIGEST'],
          }) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: image-records/result.json
          if-no-files-found: error

  bundle:
    needs: [preflight, verify-api, verify-web, verify-stack, native-cli, images-merge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image-records
      - run: python -m pip install -r scripts/releases/requirements.txt
      - name: Resolve both architectures with anonymous registry access
        run: |
          mkdir built-images
          find image-records -name '*.json' -exec sh -c 'cp "$1" "built-images/$(basename "$(dirname "$1")").json"' sh {} \;
          registry_config="$(mktemp -d "${RUNNER_TEMP}/railwait-release-registry.XXXXXX")"
          trap 'rm -rf "$registry_config"' EXIT
          plugin_directory="${DOCKER_CONFIG:-$HOME/.docker}/cli-plugins"
          if [ -d "$plugin_directory" ]; then ln -s "$plugin_directory" "$registry_config/cli-plugins"; fi
          DOCKER_CONFIG="$registry_config" python scripts/releases/resolve_images.py --built-images-dir built-images --output images.json
      - name: Confirm approved source releases can update to the resolved images
        env:
          COMPATIBLE_FROM: ${{ inputs.compatible_from }}
        run: |
          source_args=()
          IFS=',' read -ra sources <<< "$COMPATIBLE_FROM"
          for source in "${sources[@]}"; do
            if [ -n "$source" ]; then source_args+=(--compatible-from "$source"); fi
          done
          python scripts/releases/check_update_sources.py --images-json images.json \
            --repository "$GITHUB_REPOSITORY" "${source_args[@]}"
      - name: Sign release and export public verification key
        env:
          # A rehearsal never receives the release key; it signs with a key that exists only in this job.
          RAILWAIT_RELEASE_SIGNING_KEY: ${{ !inputs.dry_run && secrets.RAILWAIT_RELEASE_SIGNING_KEY || '' }}
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMPATIBLE_FROM: ${{ inputs.compatible_from }}
        run: |
          compatible_args=()
          IFS=',' read -ra sources <<< "$COMPATIBLE_FROM"
          for source in "${sources[@]}"; do
            if [ -n "$source" ]; then compatible_args+=(--compatible-from "$source"); fi
          done
          key_args=()
          if [ "$DRY_RUN" = true ]; then
            key_file="$(mktemp "${RUNNER_TEMP}/railwait-rehearsal-key.XXXXXX")"
            python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())' > "$key_file"
            key_args=(--signing-key-file "$key_file")
          fi
          python scripts/releases/build_bundle.py "${compatible_args[@]}" "${key_args[@]}" \
            --images-json images.json --output release-assets \
            --version "$RELEASE_VERSION" --source-revision "$GITHUB_SHA" \
            --public-key-output release-public-key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release-assets/*
            release-public-key.txt
          if-no-files-found: error

  image-smoke:
    needs: bundle
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/releases/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - name: Verify published images on native CPU
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: python scripts/releases/smoke_images.py --manifest artifacts/release-assets/release-manifest.json --platform "$TARGET_PLATFORM"

  cli-assets:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - name: Build CLI with pinned verification key
        working-directory: apps/cli
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The CLI reports the release version. Installed managers built as 0.1.0 still update
          # because build_bundle.py keeps the manifest's minimum_cli_version at 0.1.0.
          CLI_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          suffix=""; if [ "$GOOS" = windows ]; then suffix=.exe; fi
          public_key="$(cat ../../artifacts/release-public-key.txt)"
          package=github.com/hostkimjang/korail-auto-waitlist/apps/cli/internal/release
          go build -trimpath -ldflags "-X main.version=$CLI_VERSION -X $package.CLIVersion=$CLI_VERSION -X $package.PublicKeyBase64=$public_key" \
            -o "dist/railwait-${GOOS}-${GOARCH}${suffix}" ./cmd/railwait
          # install.sh and install.ps1 require exactly one line naming this executable.
          (cd dist && sha256sum "railwait-${GOOS}-${GOARCH}${suffix}" > "railwait-${GOOS}-${GOARCH}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/cli/dist/*
          if-no-files-found: error

  installer-scripts:
    # ubuntu-24.04 ships PowerShell 7, which runs the install.ps1 tests with faked Windows variables.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint install.sh
        run: docker run --rm -v "$PWD/scripts/install:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 install.sh tests/test-install-sh.sh
      - name: Test install.sh with sh, dash and bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: sh scripts/install/tests/test-install-sh.sh
      - name: Test install.ps1
        shell: pwsh
        run: ./scripts/install/tests/test-install-ps1.ps1
      - name: Package installer scripts with checksums
        run: |
          mkdir installer-assets
          cp scripts/install/install.sh scripts/install/install.ps1 installer-assets/
          cd installer-assets
          for script in install.sh install.ps1; do sha256sum "$script" > "$script.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: installer-scripts
          path: installer-assets/*
          if-no-files-found: error

  publish:
    needs: [image-smoke, cli-assets, installer-scripts]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: installer-scripts
          path: installer-assets
      - name: Publish only after every platform and required artifact passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMPATIBLE_FROM: ${{ inputs.compatible_from }}
        run: |
          tag="v${RELEASE_VERSION}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "$tag" --generate-notes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" artifacts/release-assets/* cli-artifacts/* installer-assets/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
