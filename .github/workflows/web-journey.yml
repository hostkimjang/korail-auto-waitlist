name: repository-verify

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yml"
      - ".env.example"
      - "README.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "infra/**"
      - "Makefile"
      - "scripts/ops.ps1"
      - ".github/workflows/web-journey.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yml"
      - ".env.example"
      - "README.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "infra/**"
      - "Makefile"
      - "scripts/ops.ps1"
      - ".github/workflows/web-journey.yml"

jobs:
  verify-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: ci-only-postgres-not-a-secret
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-not-a-secret-000000
      AUTH_SESSION_SECRET: ci-only-session-key-not-a-secret-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make config verify-api verify-web-core
  postgres-execution-lease-fencing:
    name: PostgreSQL fencing acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rail_waitlist_acceptance_ci
          POSTGRES_USER: rail_waitlist_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rail_waitlist_ci -d rail_waitlist_acceptance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: rail_waitlist_acceptance_ci
      DATABASE_USER: rail_waitlist_ci
      DATABASE_PASSWORD: ci-only-postgres-password
      POSTGRES_ACCEPTANCE_ISOLATED: "true"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --extra test
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen python scripts/check_execution_lease_fencing_postgres.py
      - run: uv run --frozen python scripts/check_observation_fencing_postgres.py
      - run: uv run --frozen python scripts/check_reservation_credential_fencing_postgres.py
