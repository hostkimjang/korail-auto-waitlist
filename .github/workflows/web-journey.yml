name: repository-verify

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yml"
      - ".env.example"
      - "README.md"
      - "CHECKLIST.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "infra/**"
      - ".gitattributes"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/web-journey.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yml"
      - ".env.example"
      - "README.md"
      - "CHECKLIST.md"
      - "CONTRIBUTING.md"
      - "docs/**"
      - "infra/**"
      - ".gitattributes"
      - "Makefile"
      - "scripts/**"
      - ".github/workflows/web-journey.yml"

jobs:
  verify-repository:
    # API의 Python Playwright 1.55는 Ubuntu 26.04 의존성 설치를 지원하지 않는다.
    # 브라우저 런타임 이미지(noble)와 같은 Ubuntu 24.04에서 검증한다.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: ci-only-postgres-not-a-secret
      SECRET_ENCRYPTION_KEY: ci-only-encryption-key-not-a-secret-000000
      AUTH_SESSION_SECRET: ci-only-session-key-not-a-secret-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: npm ci
        working-directory: apps/web
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: restore
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: uv run --python 3.12 --frozen --extra browser playwright install --with-deps chromium
        working-directory: apps/api
      - uses: ./.github/actions/playwright-apt-cache
        with:
          mode: save
      - name: Select runtime Chrome for Pydoll fixture tests
        working-directory: apps/api
        run: |
          uv run --python 3.12 --frozen --extra browser python - <<'PY'
          import os
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          installed = shutil.which("google-chrome")
          if installed is None:
              raise RuntimeError("Runtime Google Chrome is unavailable")
          binary = Path(installed)
          if not binary.is_file() or not os.access(binary, os.X_OK):
              raise RuntimeError("Runtime Google Chrome is not executable")
          version = subprocess.run(
              [str(binary), "--version"], check=True, capture_output=True, text=True, timeout=10
          ).stdout.strip()
          if not version.startswith("Google Chrome "):
              raise RuntimeError("Unexpected runtime browser family")
          # Start Chrome once before the parallel test run, as the release workflow does. The first
          # start on a fresh runner can outlast Pydoll's start timeout while other workers load the CPU.
          with tempfile.TemporaryDirectory() as profile:
              subprocess.run(
                  [
                      str(binary),
                      "--headless=new",
                      "--no-sandbox",
                      "--disable-gpu",
                      "--no-first-run",
                      f"--user-data-dir={profile}",
                      "--dump-dom",
                      "about:blank",
                  ],
                  check=True,
                  capture_output=True,
                  timeout=120,
              )
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as environment:
              environment.write(f"KORAIL_BROWSER_CHROMIUM_EXECUTABLE_PATH={binary}\n")
          print(f"Pydoll runtime browser: {version}")
          PY
      - run: bash -n scripts/*.sh
      - run: bash scripts/ops.sh config
      - run: make verify-ops
      - name: Operations script contract on macOS bash 3.2
        # macOS ships bash 3.2, which has no mapfile and treats an empty array as unbound under
        # set -u. Run the same contract there so Git installs on a Mac keep deploying.
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          bash:3.2@sha256:2556c2da19c32c1614d318645c73a7bf64d38be21cf69e98e3ca51f053983719
          sh -c 'ln -sf /usr/local/bin/bash /bin/bash && bash scripts/test-ops.sh'
      - run: make verify-api
        env:
          KORAIL_BROWSER_TEST_DISABLE_SANDBOX: "true"
      - run: make verify-web-core
  postgres-execution-lease-fencing:
    name: PostgreSQL fencing acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rail_waitlist_acceptance_ci
          POSTGRES_USER: rail_waitlist_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rail_waitlist_ci -d rail_waitlist_acceptance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_NAME: rail_waitlist_acceptance_ci
      DATABASE_USER: rail_waitlist_ci
      DATABASE_PASSWORD: ci-only-postgres-password
      POSTGRES_ACCEPTANCE_ISOLATED: "true"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --extra test
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen python scripts/check_execution_lease_fencing_postgres.py
      - run: uv run --frozen python scripts/check_observation_fencing_postgres.py
      - run: uv run --frozen python scripts/check_reservation_credential_fencing_postgres.py
