name: repository-verify

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yml"
      - "compose.fullstack-e2e.yml"
      - ".env.example"
      - "README.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "infra/**"
      - "Makefile"
      - "scripts/ops.ps1"
      - ".github/workflows/web-journey.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "compose.yml"
      - "compose.fullstack-e2e.yml"
      - ".env.example"
      - "README.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "infra/**"
      - "Makefile"
      - "scripts/ops.ps1"
      - ".github/workflows/web-journey.yml"

jobs:
  verify-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make verify
