[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "rail-waitlist-api"
version = "0.1.0"
description = "KORAIL/SRT personal waitlist assistant API"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.4,<6",
  "cryptography>=46,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "korail2==0.4.0",
  "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1",
  "pywebpush>=2.0,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "SRTrain==2.6.7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.20,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]
browser = [
  "playwright==1.55.0",
  "pydoll-python==2.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rail_waitlist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
show_error_codes = true
