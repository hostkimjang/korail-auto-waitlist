<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서비스 브리지 설정</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main>
      <h1>서비스 브리지 설정</h1>
      <p>레일웨잇 설정에서 만든 5분짜리 1회 연결 코드로 이 브라우저를 연결합니다.</p>
      <form id="bridge-settings">
        <label for="service-base-url">레일웨잇 서비스 주소</label>
        <input id="service-base-url" name="service-base-url" type="url" inputmode="url" placeholder="http://127.0.0.1 또는 https://rail.example.com" required />
        <label for="pairing-code">1회 연결 코드</label>
        <input id="pairing-code" name="pairing-code" type="password" minlength="32" autocomplete="off" required />
        <p>같은 장비의 HTTP loopback 또는 권한을 승인한 원격 HTTPS만 허용합니다. 연결 코드는 사용 즉시 폐기되고, 발급된 자격증명은 화면에 다시 표시하지 않습니다.</p>
        <button type="submit">브라우저 연결</button>
        <button id="disconnect" type="button" class="secondary" hidden>이 브라우저 연결 지우기</button>
      </form>
      <p id="status" role="status" aria-live="polite" data-state="info"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
